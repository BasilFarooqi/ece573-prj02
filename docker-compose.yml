version: "3.8"

services:
  postgres:
    image: postgres:11
    container_name: ece573-prj02-postgres-1
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: kvsdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kvs:
    build: ./kvs
    container_name: ece573-prj02-kvs-1
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: kvsdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    restart: always

volumes:
  postgres_data:
